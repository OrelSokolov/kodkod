name: kodkod
version: 0.1.2
description: |
  kodkod — a code editor (VSCode/Zed-like) built on egui-cr: a rope
  buffer for huge files, syntax highlighting via the highlight.cr
  shard (a 1:1 port of the highlight.js engine), a lazy-loading file
  tree widget, and basic VIM modal editing.

authors:
  - Oleg

dependencies:
  egui-cr:
    github: OrelSokolov/egui.cr
    branch: main
  highlight_cr:
    github: OrelSokolov/highlight.cr
    version: 0.1.2
  fswatch:
    github: OrelSokolov/fswatch.cr
    commit: b77d1386aef561e5604ee7869920684464e21b57

license: MIT
